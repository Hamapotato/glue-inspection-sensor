# 旋转扫描矩形主线配置基线
# 说明：代码中不允许出现业务阈值字面量，一律从这里读取。
# 带 [假设] 标记的项，论文未给出，属于本次复现自定参数（见 docs/algo/p0-spec.md §5）。

calib:
  enabled: false             # 无标定文件时为 false，宽度只输出像素
  mm_per_px: null            # [假设] 需用棋盘格实测填入
  pattern: [13, 9]           # 论文 4.3.2：13×9 角点棋盘格
  square_mm: 4.0             # 论文 4.3.2：方格间距 4 mm
  mapping_table: null        # 按位置的映射数据库（JSON），对应论文 4.3.2 的映射标准值

segmentation:
  mode: external              # external | development_threshold（仅无模型冒烟）
  model_path: null            # 分割模型文件；由具体部署适配器解释
  threshold: 0.5              # [假设] 概率图二值化阈值
  morph:
    ksize: 5                  # [假设] 分割后开闭核尺寸
    order: open-close         # 先开去噪点，后闭补小孔

measure:
  mask_connectivity: 8       # 分割掩膜连通域邻接方式
  min_area_px: 200           # 小于该面积的连通域视为噪点
  width:
    standard_mm: 10.0        # [假设] 论文表 5-4 的理论宽度为 10±1 mm
    warn_delta_mm: 0.5       # [假设] 双报警线：预警阈值（相对标准值的偏差）
    alarm_delta_mm: 1.0      # 报警阈值；与表 5-4 的 ±1 mm 容差一致
  scan:
    enabled: true
    step_px: 12              # [假设] 相邻扫描矩形中心距
    window_length_px: 24     # [假设] 单个扫描矩形沿胶条方向的长度
    window_width_factor: 3.0 # 矩形横向宽度至少是实测胶宽的 3 倍
    max_ray_px: 180          # [假设] 从中心向左右寻找边缘的最大搜索距离
    ray_step_px: 0.5         # [假设] 法向寻边采样间隔
    break_min_missing_windows: 1  # 缺失左右边缘的矩形即判断胶
    centerline_smooth_window: 7   # 中心线滑动平均点数
    width_range_alarm_mm: 1.2     # 同一胶条局部最大最小宽度差报警线
    width_std_alarm_mm: 0.30      # 扫描宽度标准差报警线
    curve_warn_mm: 2.0            # 中心线偏离首尾弦线的预警值
    curve_alarm_mm: 3.0           # 中心线弯曲报警值
    curve_warn_px: 10.0           # 未标定时使用的弯曲预警值
    curve_alarm_px: 16.0          # 未标定时使用的弯曲报警值

# VisionTrain 合成分割数据集。
# [合成边界] 只用于流程验证、冒烟和预训练，不能作为真实指标验收数据。
synthetic_dataset:
  version: visiontrain-glue-binary-v5
  image_size: [1080, 1440]  # (height, width)，与首台相机原图分辨率一致
  samples: 60
  seed: 20261120
  frames_per_object: 1
  centerline_points: 180
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  scenario_weights:
    glue: 0.35
    background: 0.15
    break: 0.15
    narrow: 0.125
    wide: 0.125
    width_unstable: 0.05
    curve: 0.05
  scene:
    background_range: [28.0, 76.0]
    gradient_strength: [0.04, 0.22]
    texture_sigma: [1.5, 7.0]
  glue:
    width_px: [39.0, 41.0]
    min_width_px: 5.0
    length_ratio: [0.58, 0.78]  # 相对图像宽度的中心线长度
    center_x_ratio: [0.46, 0.54]
    center_y_ratio: [0.46, 0.54]
    angle_deg: [-24.0, 24.0]
    amplitude_px: [1.0, 4.0]
    max_amplitude_ratio: 0.12
    wave_count: [0.7, 1.8]
    slope_ratio: [-0.035, 0.035]
    width_variation: [0.005, 0.03]
    value_range: [105.0, 235.0]
    texture_sigma: 8.0
  variants:
    narrow_width_scale: 0.55
    wide_width_scale: 1.45
    width_unstable_variation_scale: 4.0
    curve_amplitude_px: [32.0, 50.0]
  defects:
    break_length_ratio: [0.08, 0.18]
    break_margin_px: 2.0
  camera:
    blur_kernel: [1.0, 3.0]
    noise_sigma: 2.2

# 将 synthetic_dataset 掩膜转换为 VisionTrain 2.3 可导入格式。
# 格式依据 VisionTrain 导出样例；GUI 回读验证仍必须人工完成。
visiontrain_export:
  image_type: train
  contour_epsilon_px: 0.5
  min_contour_area_px: 1.0

# M06 同轨迹验证集。
# 所有图像共用一条固定标准胶路，只改变断胶、胶宽或局部弯曲，用于检查
# VisionMaster 的“边缘对模型缺陷检测”是否按预期命中。
# [合成边界] 仅用于流程验证和冒烟，不能作为真实产线指标验收数据。
m06_validation:
  version: m06-glue-matched-v1
  trajectory_id: m06_fixed_path_v1
  seed: 20261121
  total_samples: 100
  image_size: [1080, 1440]  # (height, width)
  pixel_format: Mono8
  min_component_area_px: 50
  counts:
    reference_good: 1
    normal: 19
    break: 20
    narrow: 20
    wide: 20
    bend: 20
  fixed_trajectory:
    centerline_points: 401
    angle_deg: 0.0
    length_ratio: 0.72
    center_x_ratio: 0.50
    center_y_ratio: 0.50
    amplitude_px: 22.0
    wave_count: 0.80
    phase_rad: 0.35
    slope_ratio: 0.0
    base_width_px: 40.0
    width_variation: 0.01
    width_phase_rad: 0.0
    min_width_px: 5.0
  background:
    background_range: [28.0, 76.0]
    gradient_strength: [0.04, 0.22]
    texture_sigma: [1.5, 7.0]
  glue_appearance:
    value_range: [130.0, 220.0]
    texture_sigma: 7.0
  camera:
    blur_kernel: [1.0, 3.0]
    noise_sigma: 1.8
  variants:
    normal_width_scale: [0.985, 1.015]
    narrow_width_scale: [0.52, 0.64]
    wide_width_scale: [1.36, 1.50]
    break_length_px: [60.0, 120.0]
    break_center_ratio: [-0.15, 0.15]
    break_margin_px: 4.0
    bend_amplitude_px: [26.0, 38.0]
    bend_center_ratio: [-0.12, 0.12]
    bend_span_ratio: [0.28, 0.38]
