# 算法配置基线（P0）
# 说明：代码中不允许出现业务阈值字面量，一律从这里读取。
# 带 [假设] 标记的项，论文未给出，属于本次复现自定参数（见 docs/algo/p0-spec.md §5）。

input:
  resize_long_side: 0        # 0 表示不缩放；缩放到该长边像素数
  to_gray: true

calib:
  enabled: false             # 无标定文件时为 false，宽度只输出像素
  mm_per_px: null            # [假设] 需用棋盘格实测填入
  pattern: [13, 9]           # 论文 4.3.2：13×9 角点棋盘格
  square_mm: 4.0             # 论文 4.3.2：方格间距 4 mm
  mapping_table: null        # 按位置的映射数据库（JSON），对应论文 4.3.2 的映射标准值

preprocess:
  denoise:
    method: wavelet          # wavelet | median | none
    wavelet: haar            # [假设] 论文未给基函数
    level: 2                 # [假设] 分解层数
    mode: hard               # 论文 4.1.1：硬阈值
  segment:
    method: otsu             # otsu | global | double_peak（论文选 Otsu）
  morph:
    ksize: 5                 # [假设] 开闭核尺寸
    order: open-close        # 先开（去噪点）后闭（补孔洞）

measure:
  bfs_connectivity: 8
  min_area_px: 200           # 小于该面积的连通域视为噪点
  skeleton:
    method: zhang_suen       # 文献 [53]
  width:
    standard_mm: 10.0        # [假设] 论文表 5-4 的理论宽度为 10±1 mm
    warn_delta_mm: 0.5       # [假设] 双报警线：预警阈值（相对标准值的偏差）
    alarm_delta_mm: 1.0      # 报警阈值；与表 5-4 的 ±1 mm 容差一致

locate:
  enabled: false
  type: heuristic            # rpn | heuristic
  weights: null
  score_thr: 0.5
  nms:
    type: ciou_nms           # nms | ciou_nms（论文 3.1.4）
    thr: 0.5                 # 论文表 3-2 中选定阈值
  anchors:
    k: 9                     # [假设] 论文用 K-means 生成，数量沿用 RPN 的 9
    iters: 100

reflect:
  enabled: false
  type: null_reflector       # yolo5fl | heuristic | null_reflector
  weights: null
  score_thr: 0.5             # [假设]
  input_size: 416
  high_value: 245            # [假设] heuristic 占位实现的饱和阈值
  min_area_px: 30            # [假设] heuristic 占位实现的最小反光面积

decide:
  broken_min_rois: 2         # 论文 5.3.3：RoI 数量 > 1 判为断胶
  reflection_override: true  # 命中反光时不直接判缺陷，改为提示调参

runtime:
  device: cpu
  half: false

# VisionTrain 合成分割数据集。
# [合成边界] 只用于流程验证、冒烟和预训练，不能作为真实指标验收数据。
synthetic_dataset:
  version: visiontrain-glue-synthetic-v1
  image_size: [1080, 1440]  # (height, width)，与首台相机原图分辨率一致
  samples: 60
  seed: 20261120
  frames_per_object: 1
  centerline_points: 180
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  scenario_weights:
    ok: 0.30
    narrow: 0.08
    wide: 0.08
    break: 0.16
    bubble: 0.12
    stringing: 0.10
    contamination: 0.10
    reflection: 0.06
  scene:
    background_range: [28.0, 76.0]
    workpiece_range: [48.0, 118.0]
    gradient_strength: [0.04, 0.22]
    texture_sigma: [1.5, 7.0]
    highlight_probability: 0.35
    highlight_gain: 45.0
    highlight_length_ratio: [1.2, 2.8]
    strong_reflection_gain: 115.0
    reflection_length_ratio: [4.0, 8.0]
  glue:
    width_px: [34.0, 58.0]
    min_width_px: 5.0
    length_ratio: [1.10, 1.55]  # 相对图像高度的中心线长度
    angle_deg: [-24.0, 24.0]
    amplitude_px: [2.0, 24.0]
    wave_count: [0.7, 1.8]
    slope_ratio: [-0.035, 0.035]
    width_variation: [0.02, 0.16]
    value_range: [105.0, 235.0]
    texture_sigma: 8.0
  variants:
    narrow_scale: [0.45, 0.70]
    wide_scale: [1.25, 1.65]
  defects:
    break_length_ratio: [0.08, 0.18]
    break_margin_px: 2.0
    bubble_radius_ratio: [0.18, 0.42]
    bubble_min_radius_px: 2.0
    bubble_ring_ratio: 0.20
    stringing_length_ratio: [1.5, 4.0]
    stringing_min_length_px: 8.0
    stringing_bend_ratio: [-0.30, 0.30]
    stringing_thickness_px: 2
    contamination_radius_ratio: [0.18, 0.55]
    contamination_min_radius_px: 2.0
  camera:
    blur_kernel: [1.0, 3.0]
    noise_sigma: 2.2
