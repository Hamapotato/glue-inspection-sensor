[package]
name = "glue-infer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glue_infer"
path = "src/lib.rs"

[[bin]]
name = "glue-infer"
path = "src/main.rs"

[dependencies]
glue-core = { path = "../core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tract-onnx = "0.21"
libloading = { version = "0.8", optional = true }

[features]
default = []
rknn = ["dep:libloading"]
aidlite = []
