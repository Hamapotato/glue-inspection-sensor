[workspace]
resolver = "2"
members = ["crates/core", "crates/vision", "crates/pipeline", "crates/store", "crates/cli", "crates/app", "crates/agent", "crates/infer", "crates/camera"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rayon = "1.10"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
